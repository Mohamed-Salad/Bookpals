name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # --legacy-peer-deps: see Dockerfile comment - stream-chat-react's
      # @emoji-mart/react peer dep hasn't caught up to React 19 yet.
      - run: npm ci --legacy-peer-deps
      - run: npm run build
