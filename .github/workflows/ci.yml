name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # --legacy-peer-deps: @emoji-mart/react's declared peer range doesn't
      # cover React 19 yet (works fine at runtime) - same reason the
      # Dockerfile and netlify.toml both pass this flag too.
      - run: npm ci --legacy-peer-deps
      - run: npm run test
      - run: npm run build
