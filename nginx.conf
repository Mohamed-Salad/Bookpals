server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router-dom does client-side routing: a request for /profile has
    # no matching file on disk, only index.html + JS that reads the URL.
    # Without this fallback, refreshing on any route but "/" 404s in nginx.
    location / {
        try_files $uri /index.html;
    }
}
